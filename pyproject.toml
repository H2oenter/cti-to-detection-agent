[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-to-detection-agent"
version = "0.1.0"
description = "Turns public threat reports into evidence-checked STIX, an ATT&CK coverage check and draft KQL hunts, with a human approval gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Omiwole" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "stix2>=3.0.1",
    "mitreattack-python>=4.0",
    "typer>=0.12",
    "rich>=13.7",
    "pypdf>=4.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]
# Run KQL against a lab workspace (stretch goal).
azure = ["azure-identity>=1.17", "azure-monitor-query>=1.4"]
# Push to a lab TIP (stretch goal).
tip = ["pymisp>=2.4.190", "pycti>=6.0"]

[project.scripts]
cti-agent = "cti_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cti_agent = ["llm/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "reports", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode look-alikes are test data here, on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
