name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, no secrets: tests replay recorded model responses.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the audit-log lock has a Windows branch, and it's where the tool runs.
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false  # Windows runners would check out CRLF
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nothing after checkout needs the token
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
